name: daily-trade

on:
  schedule:
    - cron: "7 4 * * *"   # 04:07 UTC = 11:07 WIB, once a day
  workflow_dispatch: {}     # "Run workflow" button for manual tests

permissions:
  contents: read            # the bot cannot change the repo

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -I -m unittest discover -s tests -v
      - name: Run bot
        env:
          LIVE_TRADING: ${{ vars.LIVE_TRADING }}
          MAX_TRADE_IDR: ${{ vars.MAX_TRADE_IDR || '1000000' }}
          COINS: ${{ vars.COINS || 'btc,eth,sol,xrp,doge' }}
          INDODAX_API_KEY: ${{ secrets.INDODAX_API_KEY }}
          INDODAX_API_SECRET: ${{ secrets.INDODAX_API_SECRET }}
        run: python3 -I bot.py
